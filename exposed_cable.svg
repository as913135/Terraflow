<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#1e293b"/>
  <!-- Exposed hillside mud bank -->
  <path d="M 0,220 Q 150,180 400,240 L 400,300 L 0,300 Z" fill="#451a03"/>
  <!-- Exposed 11kV black cable looping in air -->
  <path d="M 30,220 Q 200,160 370,230" fill="none" stroke="#0f172a" stroke-width="12"/>
  <path d="M 30,220 Q 200,160 370,230" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,6"/>
  <!-- Spark / warning symbol -->
  <polygon points="200,120 185,150 198,150 190,175 215,140 202,140" fill="#e11d48"/>
  <!-- Text Tag -->
  <rect x="20" y="20" width="220" height="34" rx="6" fill="#0f172a" fill-opacity="0.85"/>
  <text x="32" y="42" font-family="system-ui" font-size="13" font-weight="bold" fill="#e11d48">⚡ Exposed 11kV Cable</text>
  <text x="30" y="275" font-family="system-ui" font-size="11" fill="#94a3b8">Hadimba Crossing, Manali (32.2452, 77.1855)</text>
</svg>
