<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#1e293b"/>
  <!-- Pressure gauge -->
  <circle cx="200" cy="150" r="80" fill="#0f172a" stroke="#475569" stroke-width="4"/>
  <circle cx="200" cy="150" r="70" fill="#1e293b"/>
  <!-- Dial arc -->
  <path d="M 140,180 A 70,70 0 1,1 260,180" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="8,4"/>
  <!-- Needle at near zero -->
  <line x1="200" y1="150" x2="155" y2="165" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <circle cx="200" cy="150" r="8" fill="#ef4444"/>
  <!-- Reading text -->
  <text x="200" y="200" font-family="system-ui" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">0.4 BAR (DROP)</text>
  <!-- Text Tag -->
  <rect x="20" y="20" width="220" height="34" rx="6" fill="#0f172a" fill-opacity="0.85"/>
  <text x="32" y="42" font-family="system-ui" font-size="13" font-weight="bold" fill="#f59e0b">📉 Abnormal Pressure Drop</text>
  <text x="30" y="275" font-family="system-ui" font-size="11" fill="#94a3b8">Old Manali Homestays (32.2475, 77.1815)</text>
</svg>
