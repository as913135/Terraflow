<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#1e293b"/>
  <!-- Mountain hillside road -->
  <polygon points="0,200 400,240 400,300 0,300" fill="#334155"/>
  <!-- Crack / Depression -->
  <path d="M 120,210 Q 180,245 260,225 T 340,240" fill="none" stroke="#ef4444" stroke-width="4"/>
  <path d="M 150,220 L 165,245 L 180,230 L 210,250" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <polygon points="170,225 240,232 230,248 160,240" fill="#0f172a" opacity="0.7"/>
  <!-- Caution sign -->
  <rect x="20" y="20" width="230" height="34" rx="6" fill="#0f172a" fill-opacity="0.85"/>
  <text x="32" y="42" font-family="system-ui" font-size="13" font-weight="bold" fill="#ef4444">⚠️ Road Subsidence / Dhasna</text>
  <text x="30" y="275" font-family="system-ui" font-size="11" fill="#94a3b8">Circuit House Bend, Manali (32.2435, 77.1875)</text>
</svg>
